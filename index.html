<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5efe4">
  <title>Fahad &amp; Nesrin | Website Hub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap');

    :root {
      --paper: #f5efe4;
      --ink: #59412f;
      --muted: #8a7058;
      --line: rgba(111, 81, 53, .35)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 25%, #fffaf1, transparent 60%), linear-gradient(135deg, #f8f3ea, #eee4d5);
      color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif
    }

    main {
      width: min(620px, 100%);
      padding: clamp(32px, 7vw, 64px) clamp(22px, 6vw, 52px);
      text-align: center;
      background: rgba(250, 246, 238, .72);
      border: 1px solid var(--line);
      outline: 1px solid rgba(142, 107, 70, .16);
      outline-offset: 7px
    }

    .kicker {
      font-size: 12px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--muted)
    }

    h1 {
      font-family: "Great Vibes", cursive;
      font-size: clamp(64px, 12vw, 94px);
      font-weight: 400;
      line-height: 1;
      margin: 18px 0
    }

    .subtitle {
      font-size: 19px;
      color: var(--muted);
      line-height: 1.4;
      margin: 0 auto 34px;
      max-width: 420px
    }

    .links {
      display: grid;
      gap: 14px;
      max-width: 390px;
      margin: auto
    }

    a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 58px;
      padding: 14px 20px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff8ed;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 12px;
      transition: background .2s, color .2s, transform .2s
    }

    a:hover {
      background: transparent;
      color: var(--ink);
      transform: translateY(-2px)
    }

    a.admin {
      background: transparent;
      color: var(--ink)
    }

    a.admin:hover {
      background: var(--ink);
      color: #fff8ed
    }

    .icon {
      font-size: 18px
    }

    .note {
      margin: 28px 0 0;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .06em
    }

    @media(max-width:420px) {
      body {
        padding: 20px
      }

      main {
        padding: 38px 20px
      }

      .subtitle {
        font-size: 17px
      }

      a {
        min-height: 54px
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="kicker">Wedding website</p>
    <h1>Fahad &amp; Nesrin</h1>
    <p class="subtitle">Welcome. Choose the page you would like to open.</p>
    <nav class="links" aria-label="Website pages">
      <a href="invite.html"><span class="icon" aria-hidden="true">✧</span> Open invitation</a>
      <a class="admin" href="admin.html"><span class="icon" aria-hidden="true">♙</span> Admin dashboard</a>
    </nav>
    <p class="note">A celebration made with love.</p>
  </main>
</body>

</html>
